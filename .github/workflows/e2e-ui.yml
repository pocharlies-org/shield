name: e2e-ui

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "lib/**"
      - "e2e-ui/**"
      - ".github/workflows/e2e-ui.yml"
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "e2e-ui/**"
      - ".github/workflows/e2e-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # azureedge.net CDN is dead; npmmirror keeps driver builds >= 1.55
      PLAYWRIGHT_DOWNLOAD_HOST: https://registry.npmmirror.com/-/binary/playwright

    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"

      - name: cache playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: install playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: go run github.com/playwright-community/playwright-go/cmd/playwright@v0.6000.0 install --with-deps chromium

      - name: install playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: go run github.com/playwright-community/playwright-go/cmd/playwright@v0.6000.0 install-deps chromium

      - name: run e2e ui tests
        run: go test -v -count=1 -timeout=5m -tags=e2e ./e2e-ui/...
