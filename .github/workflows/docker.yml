name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: arc-k8s
            artifact: linux-amd64
          - platform: linux/arm64
            # 2026-10-05 devops · fuera de pool: no existe pool arm64 en el clúster (skill ci-runners-arc, INFRA-548)
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: login to ghcr.io
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push to ghcr.io
        id: build-ghcr
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            CI=github
            GITHUB_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/shield,push-by-digest=true,name-canonical=true,push=true

      - name: export digest
        run: |
          mkdir -p /tmp/digests/ghcr
          digest_ghcr="${{ steps.build-ghcr.outputs.digest }}"
          touch "/tmp/digests/ghcr/${digest_ghcr#sha256:}"

      - name: upload ghcr digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-ghcr-${{ matrix.artifact }}
          path: /tmp/digests/ghcr/*
          retention-days: 1

  merge:
    runs-on: arc-k8s
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: download ghcr digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests/ghcr
          pattern: digests-ghcr-*
          merge-multiple: true

      - name: verify all digests present
        run: |
          expected=2
          actual=$(find /tmp/digests/ghcr -maxdepth 1 -type f | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "Expected $expected digests for ghcr, found $actual"
            ls -la /tmp/digests/ghcr
            exit 1
          fi
          echo "All $expected digests present for ghcr"

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: login to ghcr.io
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set docker tags
        id: tags
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$HEAD_BRANCH" == v* ]]; then
            echo "tag=${HEAD_BRANCH}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "tag=${HEAD_BRANCH}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: create ghcr manifest and push
        working-directory: /tmp/digests/ghcr
        run: |
          tags="-t ghcr.io/${{ github.repository_owner }}/shield:${{ steps.tags.outputs.tag }}"
          if [[ "${{ steps.tags.outputs.is_release }}" == "true" ]]; then
            tags="$tags -t ghcr.io/${{ github.repository_owner }}/shield:latest"
          fi
          docker buildx imagetools create $tags \
            $(printf 'ghcr.io/${{ github.repository_owner }}/shield@sha256:%s ' *)
